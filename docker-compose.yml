services:
  wavr:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # network_mode: host keeps the in-app loopback guard valid (peer stays real loopback
    # on localhost access). Linux/appliance only; on Docker Desktop Windows/Mac host
    # networking is limited — run uvicorn directly there instead (see docs).
    network_mode: host
    env_file:
      - .env            # WAVR_* + GEMINI_API_KEY; never baked into the image
    volumes:
      - wavr-data:/data # SQLite persists across restarts (derived RoomState only)
      # A DEV CONVENIENCE, not a fix: backend/Dockerfile now bakes frontend/ into
      # the image (it has to -- wavr.app resolves the dashboard as
      # parents[2]/"frontend"/"index.html", so an image without it serves the API
      # and 404s on `GET /`). This read-only mount shadows the baked copy so
      # editing frontend/index.html on the host takes effect without a rebuild.
      # Safe to delete; the image works without it.
      - ./frontend:/app/frontend:ro
    restart: unless-stopped

    # --- GPU/camera variant (opt-in): uncomment when using a torch+cv2 image (see docs).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  wavr-data:
