; Wavr sensor node - PlatformIO project.
; First target board: any ESP32 Dev Module (WROOM-32) + HLK-LD2450 mmWave
; radar. See ../README.md for the flash + wiring walkthrough and
; ../NODE_PROTOCOL.md for the wire contract this firmware speaks.

[env:esp32dev]
; Pinned, not floating: a reproducible build needs the exact platform/core
; and library versions fixed, not "whatever is newest this month". 7.1.3 is
; the current stable espressif32 platform release, built on Arduino-ESP32
; 3.x / ESP-IDF 5.x / mbedtls 3.x -- this firmware's code (mbedtls_sha256(),
; not the mbedtls_sha256_ret() name mbedtls 2.x/IDF 4.4 used) is written for
; that core. ArduinoJson is pinned to the last 6.x release: this firmware
; uses the 6.x API (StaticJsonDocument, createNestedArray()), which
; ArduinoJson 7 removed/renamed.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
build_flags =
    -D WAVR_FW_VERSION=\"1.0.0\"

; Optional: build a PIR node instead of the default LD2450 build. Flash with
;   pio run -e esp32dev-pir -t upload
; and declare sensor_type "pir" (not "ld2450") when minting the node's
; enrollment code in Wavr.
[env:esp32dev-pir]
extends = env:esp32dev
build_flags =
    -D WAVR_FW_VERSION=\"1.0.0\"
    -D WAVR_SENSOR_DRIVER=WAVR_SENSOR_PIR

; Local-network OTA upload (ArduinoOTA/espota) for a node that already has a
; build on it from a USB flash. Set upload_port to the node's current LAN IP
; (or its mDNS-ish OTA hostname if your network resolves it) before using
; this, and keep --auth in sync with WAVR_OTA_PASSWORD in include/config.h.
;   pio run -e esp32dev-ota -t upload
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.0
upload_flags =
    --auth=wavr-node-ota

; Native (host-compiled) unit test for the one piece of pure,
; hardware-independent logic in this firmware worth protecting outside real
; hardware: the SHA-256 fingerprint hex formatting in
; src/fingerprint_fmt.{h,cpp}, which must match
; backend/wavr/tls.py::format_fingerprint byte-for-byte (see
; test/test_fingerprint_fmt/). Everything else here talks to real UART/
; Wi-Fi/NVS/TLS and is not meaningfully testable without mocking hardware,
; which is out of scope. build_src_filter excludes the rest of src/ (main.cpp
; etc. pull in Arduino.h, which does not exist for this platform).
[env:native]
platform = native
build_src_filter = +<fingerprint_fmt.cpp>
test_build_src = yes
test_framework = unity
