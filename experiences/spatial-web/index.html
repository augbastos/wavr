<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavr — Spatial Web Experience</title>
<!--
  Reference experience #1: the whole SDK surface, in one page.

  Uses the real `sdk/javascript/wavr.js` against a real Core. Nothing here is
  mocked, and nothing here is a screenshot: if the Core cannot answer, this page
  says so rather than showing a plausible house.

  What it is for: somebody who has just installed Wavr and wants to see what an
  application can actually know. Read the source of `render()` — it is the whole
  contract in about forty lines.

  ## Localisation

  The same three files the shell loads, in the same order, fetched from the Core
  that served this page — no build step and no third-party origin. The catalogue
  key IS the English sentence, so a locale with no entry for a line renders
  correct English rather than an identifier.

  Two kinds of text on this page are deliberately NOT translated, and both are
  load-bearing:

    * capability ids (`presence`, `count`, …) and `precision` are the literal
      values `ctx.can("presence")` is called with. A developer reading this page
      is matching them against their own code; a translated pill would be a
      different string from the one the API takes.
    * `limitations` are composed by the Core and each one NAMES THE ROOM. A
      household's own word for a place must never enter the translation layer:
      it can come back "translated", and every miss is recorded in
      `WavrI18n.missing()`, which is an audit surface.

  SPDX-License-Identifier: AGPL-3.0-or-later
-->
<script src="../../js/i18n.js"></script>
<script src="../../js/locale-pt.js"></script>
<script src="../../js/format.js"></script>
<style>
  :root {
    --bg: #0f1115; --fg: #e6e8ec; --dim: #9aa1ad; --line: #262b34;
    --ok: #4ade80; --warn: #fbbf24; --off: #6b7280; --accent: #60a5fa;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fbfcfd; --fg: #1a1d23; --dim: #5b6472; --line: #e2e6ec; }
  }
  /* Four sizes, and only four: 28 / 18 / 14 / 11.5. A room's NAME is the thing
     you scan for, so it gets the second step all to itself and everything
     supporting it drops a full rung. An earlier version used seven sizes
     between 11 and 20, which reads as one undifferentiated block. */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 24px 40px; background: var(--bg); color: var(--fg);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); margin: 0 0 28px; font-size: 14px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .room {
    border: 1px solid var(--line); border-radius: 12px; padding: 18px;
    background: color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .room h2 {
    font-size: 18px; line-height: 1.25; margin: 0 0 6px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .state { font-size: 14px; color: var(--dim); }
  h2 .state { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .state.occupied { color: var(--ok); }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .cap {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .cap.on { border-color: var(--accent); color: var(--accent); }
  .limits { margin: 14px 0 0; padding: 0; list-style: none; }
  .limits li {
    font-size: 11.5px; line-height: 1.5; color: var(--warn);
    padding-left: 16px; position: relative; margin-top: 6px;
  }
  .limits li::before { content: "!"; position: absolute; left: 3px; font-weight: 700; }
  .meta { font-size: 11.5px; color: var(--dim); margin-top: 12px; }
  #log {
    margin-top: 32px; border-top: 1px solid var(--line); padding-top: 16px;
    font: 11.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
    max-height: 220px; overflow: auto;
  }
  #log b { color: var(--fg); font-weight: 600; }
  .banner {
    border: 1px solid var(--warn); color: var(--warn); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 20px; font-size: 14px;
  }
  .banner.err { border-color: #f87171; color: #f87171; }
</style>

<h1 data-i18n>Spatial Web Experience</h1>
<p class="sub" id="sub" data-i18n>Connecting…</p>
<div id="banner"></div>
<div class="grid" id="rooms"></div>
<div id="log"></div>

<script type="module">
import { WavrClient, WavrError, ERROR_AUTH } from "../../sdk/javascript/wavr.js";

// The capability ids the SDK takes, verbatim. See the note at the top of the
// file: these are arguments to `ctx.can(...)`, not prose.
const CAPS = ["presence", "count", "position", "anchors", "display", "audio"];
const wavr = new WavrClient();          // same origin: this page is served by the Core
const $ = (id) => document.getElementById(id);

/** Write text an element's markup no longer owns.
 *
 * Dropping `data-i18n` first matters: the element's English is marked so it
 * reads correctly before this script runs, and a later `WavrI18n.apply()`
 * would otherwise put that English back over whatever we wrote — including,
 * for `#sub`, the household's own name for their Space.
 */
function setText(el, text) {
  el.removeAttribute("data-i18n");
  el.textContent = text;
}

function banner(text, kind = "") {
  $("banner").innerHTML = text ? `<div class="banner ${kind}">${esc(text)}</div>` : "";
}

/**
 * The whole contract, rendered.
 *
 * Note what this does NOT do: it never prints a 0 for an unknown headcount, and
 * it never hides a limitation to make the card look tidier. Those two omissions
 * are the entire difference between an honest spatial UI and a confident one.
 */
function render(rooms) {
  $("rooms").innerHTML = "";
  for (const ctx of rooms) {
    const el = document.createElement("div");
    el.className = "room";

    const occupied = ctx.occupied === true;
    const state = ctx.occupied === null
      ? WavrT("not observed")
      : occupied ? WavrT("someone is here") : WavrT("empty");

    // The count line, and the reason this page exists. `occupancyKnown` false is
    // NOT zero people — it is nobody counting, and saying "0" would be inventing
    // a fact about somebody's home.
    const count = ctx.occupancyKnown
      ? WavrT("{n} person|{n} people", { n: ctx.occupancy })
      : WavrT("no headcount available here");

    // A middot-separated LIST of independent facts, not a sentence assembled
    // from fragments — each item is whole on its own, and each plural is
    // selected inside its own string.
    const meta = [
      WavrT("precision {level}", { level: ctx.precision }),
      WavrT("confidence {percent}", {
        percent: WavrFmt.number(ctx.confidence,
                                { style: "percent", maximumFractionDigits: 0 }),
      }),
      WavrT("{n} anchor|{n} anchors", { n: ctx.anchors.length }),
      WavrT("{n} screen|{n} screens", { n: ctx.displays().length }),
    ].join(" · ");

    el.innerHTML = `
      <h2>${esc(ctx.room)}
        <span class="state ${occupied ? "occupied" : ""}">${esc(state)}</span></h2>
      <div class="state">${esc(count)}</div>
      <div class="caps">${CAPS.map((c) =>
        `<span class="cap ${ctx.can(c) ? "on" : ""}">${c}</span>`).join("")}</div>
      ${ctx.limitations.length
        ? `<ul class="limits">${ctx.limitations.map((l) =>
            `<li>${esc(l)}</li>`).join("")}</ul>`
        : ""}
      <div class="meta">${esc(meta)}</div>`;
    $("rooms").appendChild(el);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function log(line) {
  const el = document.createElement("div");
  el.innerHTML = line;
  $("log").prepend(el);
  while ($("log").children.length > 60) $("log").lastChild.remove();
}

async function refresh() {
  try {
    render(await wavr.context());
  } catch (err) {
    // `err.message` is not translated: it is the Core's own words, and it can
    // carry a room's name.
    banner(WavrT("Could not read the Space: {reason}", { reason: err.message }), "err");
  }
}

(async () => {
  try {
    await wavr.connect();
  } catch (err) {
    // Two whole sentences rather than one built from a translated tail: which
    // hint applies changes the whole line, and Portuguese agrees around the
    // words that would be joined.
    banner(err instanceof WavrError && err.kind === ERROR_AUTH
      ? WavrT("Could not connect: {reason}. This page has to be opened from the Core "
            + "itself, or with a paired credential.", { reason: err.message })
      : WavrT("Could not connect: {reason}. Is the Core running?",
              { reason: err.message }), "err");
    setText($("sub"), WavrT("Not connected."));
    return;
  }

  // The Space's name is the household's own word for their home. It goes into
  // a {slot}; it is never looked up in the catalogue.
  setText($("sub"), wavr.space?.name
    ? WavrT("{space} · protocol v{version}",
            { space: wavr.space.name, version: wavr.protocolVersion })
    : WavrT("This Space · protocol v{version}", { version: wavr.protocolVersion }));

  if (wavr.protocolAhead) {
    // Surfaced, not fatal. See the SDK's module docstring: refusing would break
    // every application the day somebody updates their Core.
    banner(WavrT("This Core speaks a newer contract than this page was written "
               + "against. Everything below is still read from known fields."));
  }

  await refresh();

  // Live. Every event refreshes the affected room — and note that a reconnect
  // resumes from the last event seen, so a dropped link costs latency and not
  // a missed change.
  wavr.subscribe((ev) => {
    // A log RECORD, not a sentence: an event id the API defines, the room's own
    // name, and a clock reading. The time goes through `WavrFmt` rather than
    // being sliced out of the ISO string, which was fixed at UTC and at a
    // 24-hour clock for every reader.
    log(`<b>${esc(ev.event)}</b> ${esc(ev.room)} `
      + `<span>${esc(WavrFmt.time(ev.at, { hour: "2-digit", minute: "2-digit",
                                           second: "2-digit" }))}</span>`);
    refresh();
  }, {
    onError: (e) => log(esc(WavrT("stream error: {reason}", { reason: e.message }))),
  });

  log(esc(WavrT("Connected. Waiting for something to change.")));
})();
</script>
