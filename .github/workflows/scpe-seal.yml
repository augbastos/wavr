name: scpe-seal

# Thin caller for the TRUSTED half. Body lives once in
# augbastos/.github/.github/workflows/scpe-seal-reusable.yml.
#
# The trigger has to stay HERE: `workflow_run.workflows` matches a workflow name in
# THIS repository, so a reusable workflow cannot own it. And a workflow cannot name
# itself there — that is why this is a second file rather than a job in scpe.yml.
#
# The permissions below are granted by the CALLER on purpose: a called workflow can
# narrow the token it is handed, never widen it. Drop one and the seal stops posting.
on:
  workflow_run:
    workflows: ["scpe"]
    types: [completed]

permissions:
  contents: read

jobs:
  seal:
    permissions:
      pull-requests: write
      actions: read
      contents: read
    uses: augbastos/.github/.github/workflows/scpe-seal-reusable.yml@main
