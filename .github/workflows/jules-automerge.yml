name: auto-merge maintenance PRs

# Merges a background-maintenance pull request once this repository's own test
# workflow has passed on it, so the review queue drains itself and the
# maintenance loop never stalls at its cap waiting for a human.
#
# Alex's call (2026-08-14): anything that passes CI may merge itself,
# INCLUDING product code. The reasoning is his and it is sound for this
# repository - the suite is large and honest, and a change that survives it is
# more verified than most things a tired human waves through at midnight.
#
# What follows are therefore NOT quality gates. They are integrity gates: every
# one of them exists to keep the sentence "CI passed" from becoming a lie.
#
# WHY NOT `gh pr merge --auto`: that flag means "merge when REQUIRED checks
# pass", and a repository with no required checks configured has none to wait
# for - so it merges immediately, before CI has said anything. It is safe only
# behind branch protection, which is a repository setting, and a setting nobody
# can see in a diff is the wrong home for the only thing between an agent and
# main. Triggering on `workflow_run` puts the gate in a file you can read.
#
# WHY `workflow_run` IS SAFE HERE: it runs from the DEFAULT BRANCH with write
# permissions - which is precisely why it must never check out the pull
# request's code. It does not. Every fact comes from the API; nothing from the
# branch is executed, sourced, or interpolated into a shell.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    # The suite must have SUCCEEDED, on a pull-request run. Green on main says
    # nothing about a branch.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether this pull request may merge itself
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAX_CHANGED_LINES: "600"
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                 --jq '[.[] | select(.state=="open")][0].number // empty')
          if [ -z "$pr" ]; then echo "no open PR for $HEAD_SHA"; exit 0; fi

          meta=$(gh api "repos/$REPO/pulls/$pr")
          branch=$(printf '%s' "$meta"   | jq -r .head.ref)
          draft=$(printf '%s' "$meta"    | jq -r .draft)
          same_repo=$(printf '%s' "$meta"| jq -r '.head.repo.full_name == .base.repo.full_name')
          adds=$(printf '%s' "$meta"     | jq -r .additions)
          dels=$(printf '%s' "$meta"     | jq -r .deletions)

          # INTEGRITY GATE 1 - it has to be our own agent, on this repository.
          # A fork is refused outright: a stranger opening a pull request must
          # never reach main, no matter how green.
          if [ "$same_repo" != "true" ]; then echo "PR #$pr is from a fork - refusing"; exit 0; fi
          if [ "$draft" = "true" ]; then echo "PR #$pr is a draft"; exit 0; fi
          # Agrupado. Sem os parenteses isto era `(^jules/)|([0-9]{15,})`, e
          # QUALQUER branch com quinze digitos em qualquer posicao contava como
          # manutencao — inclusive uma que nunca comecou com `jules/`.
          if ! printf '%s' "$branch" | grep -qE '^(jules/|[a-z-]+-[0-9]{15,}$)'; then
            echo "PR #$pr ($branch) is not a maintenance branch - for a human"
            exit 0
          fi

          # INTEGRITY GATE 2 - size. Not a judgement about quality: a 2000-line
          # change nobody reads is a different kind of event from a 30-line one,
          # and the brief tells the agent to make the smallest correct fix. A
          # large diff means the task drifted, which is worth ten minutes of a
          # human's attention. Raise this number if it ever bites for real.
          if [ $((adds + dels)) -gt "$MAX_CHANGED_LINES" ]; then
            echo "PR #$pr changes $((adds + dels)) lines (cap $MAX_CHANGED_LINES) - for a human"
            exit 0
          fi

          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files" \
                    --jq '.[] | "\(.status) \(.filename)"')
          echo "files:"; printf '%s\n' "$files" | sed 's/^/  /'

          # INTEGRITY GATE 3 - two areas this loop never merges on its own,
          # whatever the diff looks like.
          #
          # It used to check that no test file was DELETED, which reads well and
          # catches the wrong half of the problem: a test can be neutered in
          # place. Replacing an assertion with `assert True` keeps the file, so
          # the status is `modified`, so the old gate waved it through — and the
          # suite then passes because the assertion that would have failed is
          # gone. Same for the workflow gate below: it checked that a workflow
          # diff LOOKED like a pin move, and `uses: attacker/action@main` looks
          # exactly like a pin move.
          #
          # Both holes close the same way, and it is not a cleverer regex. These
          # two paths are the ones that decide whether the OTHER gates mean
          # anything, so an automated change to either of them is a decision a
          # person makes. There is no pattern to defeat when there is no pattern.
          if printf '%s\n' "$files" | grep -qE '^[a-z]+ backend/tests/'; then
            echo "PR #$pr touches the test suite - a human decides that"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^[a-z]+ \.github/workflows/'; then
            echo "PR #$pr touches a workflow - a human decides that"
            exit 0
          fi

          # INTEGRITY GATE 5 - every OTHER check on this exact commit has to have
          # finished, and finished well. This workflow is woken by "tests", and
          # "tests" is merely the workflow that usually finishes first: `docker`
          # and `install-matrix` run on the same head and can still be running,
          # or already red, at this moment. Merging on one green answer while
          # two are outstanding is not a gate, it is a race that usually wins.
          #
          # Absence is not failure. A path-filtered workflow that genuinely did
          # not apply to these files produces no check run at all, and demanding
          # one would deadlock every PR that does not touch its paths. Only
          # checks that EXIST are judged.
          #
          # This job excludes ITSELF, and the way it does so used to be wrong in
          # a way nothing reported. The filter matched `auto-merge maintenance`,
          # which is the name of the WORKFLOW; the Checks API exposes the name
          # of the JOB, which is `merge`. Verified against the API on a real
          # commit: `.check_runs[].name` comes back as `merge`.
          #
          # So this job's own check-run — `in_progress` for as long as this step
          # runs, by definition — stayed in the list, the next test found a
          # check that had not completed, and the gate stood down. Every time.
          # A gate that always refuses is the safe direction to be broken in,
          # and it is still broken: it never merged anything, and it reported
          # that as "checks still running" rather than as a fault.
          #
          # Excluded by check-run ID now, not by any name. The ID is this run's
          # own, so it cannot be confused with another job that happens to be
          # called `merge`.
          eu=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                 --jq "[.check_runs[] | select(.name == \"merge\" and .status != \"completed\")][0].id // empty")
          runs=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                   --jq '.check_runs[] | [(.id|tostring), .name, .status, (.conclusion // "")] | @tsv' \
                 | awk -F'\t' -v eu="$eu" '$1 != eu' \
                 | cut -f2- || true)

          if [ -z "$runs" ]; then
            echo "no check runs on $HEAD_SHA - refusing to merge on silence"
            exit 0
          fi

          pendentes=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed"')
          if [ -n "$pendentes" ]; then
            echo "checks still running on $HEAD_SHA - this pass does not merge:"
            printf '%s\n' "$pendentes" | sed 's/^/  /'
            exit 0
          fi

          # `skipped` and `neutral` are legitimate outcomes for a job that had
          # nothing to do. Everything else that is not `success` is a stop.
          ruins=$(printf '%s\n' "$runs" \
                  | awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral"')
          if [ -n "$ruins" ]; then
            echo "a check on $HEAD_SHA did not pass - a human decides:"
            printf '%s\n' "$ruins" | sed 's/^/  /'
            exit 0
          fi

          echo "PR #$pr cleared - all $(printf '%s\n' "$runs" | wc -l) checks on $HEAD_SHA are green"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.gate.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          gh pr comment "$PR" --repo "$REPO" --body \
            "Merged automatically: every check on this commit finished green and the change cleared the integrity gates (own agent, same repo, bounded size, no test deleted, no workflow change beyond a pin move)."
