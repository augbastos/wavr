name: scpe

# SCPE level 1 — https://github.com/augbastos/scpe
#
# Thin caller. The whole check, its comments and the pinned action version live once
# in augbastos/.github/.github/workflows/scpe-verify.yml — edit there, every repo
# follows. Tracks @main on purpose: a single edit is meant to propagate.
#
# The NAME above matters: the companion scpe-seal.yml matches this workflow by name.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: augbastos/.github/.github/workflows/scpe-verify.yml@main
    with:
      level: "1"                   # 1 = disclosure lint · 2 = signed envelope required
      require: "true"             # "true" makes a missing disclosure fail the check
