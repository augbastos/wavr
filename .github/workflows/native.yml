name: native

# The host build runs on every PR and main push. Cross builds run for relevant
# changes and every release candidate; sanitizer and fuzz jobs are release-only.
#
# What each job proves: `host` and `sanitizers` RUN the answer key and the C
# consumer on Linux x86_64; `fuzz` runs real libFuzzer (clang) briefly over
# every parser boundary; `cross` and `android` only COMPILE -- a successful
# build says the code is portable, never that it runs (docs/PLATFORMS.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  # From https://ziglang.org/download/index.json for that exact file.
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$HEAD_REF" == release/* ]]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "platform=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}"); then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(native/|clients/|core-launcher/|conformance/|firmware/wavr_node/src/fingerprint_fmt\.|\.github/workflows/native\.yml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build, then run the answer key and the outside C consumer
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  sanitizers:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Answer key under ASan + UBSan
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAVR_SANITIZE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  fuzz:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends ninja-build clang
      - name: libFuzzer, 30 s per boundary, seeded from the answer key
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DWAVR_FUZZ=ON -DWAVR_LIBFUZZER=ON -DWAVR_SANITIZE=ON
          cmake --build build --target fuzz_http_response fuzz_snapshot fuzz_status \
            fuzz_framer fuzz_node_state fuzz_url fuzz_heartbeat
          python3 scripts/gen_fuzz_corpus.py corpus
          for t in http_response snapshot status framer node_state url heartbeat; do
            ./build/fuzz_$t -max_total_time=30 -max_len=65536 -timeout=5 corpus/fuzz_$t
          done

  cross:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install Zig (pinned by hash)
        run: |
          curl -sSfL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          mkdir zig && tar -xJf zig.tar.xz -C zig --strip-components=1
      - name: Build for every target (compile only)
        run: |
          for t in aarch64-linux-musl arm-linux-musleabihf x86-linux-musl mipsel-linux-musleabi \
                   mips-linux-musleabi aarch64-windows-gnu aarch64-macos x86_64-macos; do
            cmake -S native -B "build-$t" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=native/cmake/zig-toolchain.cmake \
              -DZIG="$PWD/zig/zig" -DZIG_TARGET="$t"
            cmake --build "build-$t"
          done

  android:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: NDK build of the JNI library (the runner ships an NDK)
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S native -B "build-$abi" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26
            cmake --build "build-$abi" --target wavr_native_jni wavr
          done
